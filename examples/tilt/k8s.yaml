apiVersion: apps/v1
kind: Deployment
metadata:
  name: tilt-sample
  labels:
    app.kubernetes.io/name: tilt-sample
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tilt-sample
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tilt-sample
    spec:
      containers:
        - name: web
          image: tilt-sample
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: tilt-sample
  labels:
    app.kubernetes.io/name: tilt-sample
spec:
  selector:
    app.kubernetes.io/name: tilt-sample
  ports:
    - name: http
      port: 80
      targetPort: 80
